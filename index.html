<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiviMarket - Recargas Free Fire</title>
    <style>
        /* ===== RESET Y BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 850px;
            width: 100%;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #9b30ff;
            border-radius: 10px;
        }

        /* ===== TARJETA PRINCIPAL ===== */
        .card {
            background: #0d0d0d;
            padding: 40px 40px 25px;
            border-radius: 40px;
            text-align: center;
            border: 2px solid #9b30ff;
            box-shadow: 0 0 30px rgba(155, 48, 255, 0.25);
            margin-bottom: 30px;
            transition: box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(155, 48, 255, 0.03), transparent 70%);
            animation: rotarGlow 20s linear infinite;
        }

        @keyframes rotarGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .card:hover {
            box-shadow: 0 0 50px rgba(155, 48, 255, 0.4), 0 0 100px rgba(155, 48, 255, 0.1);
        }

        .card>* {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 52px;
            font-weight: 700;
            color: #c084fc;
            text-shadow: 0 0 15px #9b30ff, 0 0 30px #7a1fcc, 0 0 60px #5a0fa8;
            letter-spacing: 2px;
        }

        .line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #9b30ff, transparent);
            margin: 10px auto 16px;
            border-radius: 10px;
            box-shadow: 0 0 20px #9b30ff;
        }

        .subtitle {
            font-size: 17px;
            color: #b0a0c0;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        .subtitle span {
            color: #c084fc;
            font-weight: 500;
        }

        /* ===== SALDO ===== */
        .saldo-container {
            background: rgba(155, 48, 255, 0.08);
            border: 1px solid #3a2a4a;
            border-radius: 60px;
            padding: 10px 25px;
            display: inline-block;
            margin-bottom: 18px;
            transition: 0.3s ease;
        }

        .saldo-container:hover {
            border-color: #9b30ff;
            box-shadow: 0 0 25px rgba(155, 48, 255, 0.15);
        }

        .saldo-container span {
            color: #c084fc;
            font-weight: 700;
            font-size: 20px;
            text-shadow: 0 0 20px rgba(155, 48, 255, 0.3);
        }

        /* ===== INPUTS ===== */
        .input-group {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .input-group input {
            background: #1a1a1a;
            border: 2px solid #3a2a4a;
            border-radius: 30px;
            padding: 14px 24px;
            color: #e0d0f0;
            font-size: 16px;
            width: 100%;
            max-width: 380px;
            outline: none;
            transition: 0.3s ease;
            text-align: center;
            letter-spacing: 1px;
        }

        .input-group input:focus {
            border-color: #9b30ff;
            box-shadow: 0 0 30px rgba(155, 48, 255, 0.2);
            transform: scale(1.02);
        }

        .input-group input::placeholder {
            color: #5a4a6a;
        }

        .input-group .input-hint {
            color: #5a4a6a;
            font-size: 12px;
            margin-top: -5px;
        }

        /* ===== BOTONES ===== */
        .btn {
            display: inline-block;
            padding: 14px 48px;
            background: transparent;
            color: #d8b4fe;
            font-weight: 700;
            font-size: 17px;
            border: 2px solid #9b30ff;
            border-radius: 60px;
            text-decoration: none;
            letter-spacing: 1.5px;
            transition: 0.3s ease;
            box-shadow: 0 0 15px rgba(155, 48, 255, 0.2);
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(155, 48, 255, 0.1), transparent 70%);
            opacity: 0;
            transition: 0.3s ease;
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn:hover {
            background: #9b30ff;
            color: #0a0a0a;
            box-shadow: 0 0 35px #9b30ff, 0 0 70px rgba(155, 48, 255, 0.2);
            transform: scale(1.04);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-small {
            padding: 10px 28px;
            font-size: 14px;
        }

        .btn-success {
            background: #2a8a4a;
            border-color: #2a8a4a;
            color: #fff;
        }

        .btn-success:hover {
            background: #3aaa5a;
            border-color: #3aaa5a;
            box-shadow: 0 0 35px rgba(42, 138, 74, 0.4);
        }

        /* ===== FOOTER ===== */
        .footer-phone {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #2a1a3a;
            font-size: 15px;
            color: #7a6a8a;
        }

        .footer-phone strong {
            color: #c084fc;
            font-weight: 600;
        }

        /* ===== CATÁLOGO ===== */
        .catalogo {
            background: #0d0d0d;
            border-radius: 40px;
            border: 1px solid #3a2a4a;
            padding: 30px 30px 35px;
            box-shadow: 0 0 20px rgba(155, 48, 255, 0.08);
            margin-bottom: 30px;
        }

        .catalogo h2 {
            color: #c084fc;
            font-size: 28px;
            text-align: center;
            text-shadow: 0 0 20px rgba(155, 48, 255, 0.3);
            margin-bottom: 5px;
        }

        .catalogo .sub {
            text-align: center;
            color: #7a6a8a;
            font-size: 14px;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* ===== PRODUCTO ===== */
        .producto {
            background: #141414;
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #9b30ff;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
            gap: 10px;
        }

        .producto:hover {
            background: #1a1a1a;
            border-left-color: #c084fc;
            transform: translateX(8px) scale(1.01);
            box-shadow: 0 0 30px rgba(155, 48, 255, 0.05);
        }

        .producto .info {
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .producto .info .nombre {
            color: #e0d0f0;
            font-weight: 600;
            font-size: 17px;
        }

        .producto .info .detalle {
            color: #7a6a8a;
            font-size: 13px;
        }

        .producto .precio {
            color: #c084fc;
            font-weight: 700;
            font-size: 20px;
            text-shadow: 0 0 15px rgba(155, 48, 255, 0.2);
            white-space: nowrap;
        }

        .btn-add {
            background: transparent;
            border: 1px solid #6a2b9e;
            color: #d8b4fe;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .btn-add:hover {
            background: #9b30ff;
            color: #0a0a0a;
            box-shadow: 0 0 25px #9b30ff;
            transform: scale(1.05);
        }

        .btn-add.added {
            background: #2a8a4a;
            border-color: #2a8a4a;
            color: #fff;
            box-shadow: 0 0 25px rgba(42, 138, 74, 0.3);
        }

        /* ===== LOADER ===== */
        .loader {
            text-align: center;
            color: #5a4a6a;
            padding: 30px 0;
        }

        .loader .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #2a1a3a;
            border-top: 3px solid #9b30ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== CARRITO ===== */
        .carrito {
            background: #0d0d0d;
            border-radius: 40px;
            border: 2px solid #9b30ff;
            padding: 25px 30px 30px;
            box-shadow: 0 0 30px rgba(155, 48, 255, 0.15);
            margin-bottom: 30px;
            transition: 0.4s ease;
        }

        .carrito:hover {
            box-shadow: 0 0 50px rgba(155, 48, 255, 0.2);
        }

        .carrito-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .carrito h3 {
            color: #c084fc;
            font-size: 22px;
            text-shadow: 0 0 20px rgba(155, 48, 255, 0.2);
        }

        .carrito .badge {
            background: #9b30ff;
            color: #0a0a0a;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 14px;
        }

        .carrito-vacio {
            color: #5a4a6a;
            text-align: center;
            padding: 25px 0;
            font-size: 15px;
        }

        .carrito-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1a1a1a;
            animation: fadeInUp 0.3s ease forwards;
        }

        .carrito-item:last-child {
            border-bottom: none;
        }

        .carrito-item .item-info {
            color: #d0c0e0;
            font-size: 15px;
        }

        .carrito-item .item-info strong {
            color: #c084fc;
        }

        .carrito-item .item-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .carrito-item .item-precio {
            color: #c084fc;
            font-weight: 700;
        }

        .carrito-item .btn-remove {
            background: none;
            border: none;
            color: #6a3a5a;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s ease;
            padding: 0 8px;
        }

        .carrito-item .btn-remove:hover {
            color: #ff4a6a;
            transform: scale(1.2);
        }

        .carrito-item .cantidad-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .carrito-item .cantidad-control button {
            background: #1a1a1a;
            border: 1px solid #3a2a4a;
            color: #c084fc;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .carrito-item .cantidad-control button:hover {
            background: #9b30ff;
            border-color: #9b30ff;
            color: #0a0a0a;
        }

        .carrito-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 18px;
            margin-top: 15px;
            border-top: 2px solid #2a1a3a;
            font-size: 20px;
            color: #e0d0f0;
        }

        .carrito-total .total-precio {
            color: #c084fc;
            font-weight: 700;
            font-size: 28px;
            text-shadow: 0 0 30px rgba(155, 48, 255, 0.3);
        }

        .btn-checkout {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #9b30ff, #7a1fcc);
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }

        .btn-checkout::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 70%);
            opacity: 0;
            transition: 0.3s ease;
        }

        .btn-checkout:hover::before {
            opacity: 1;
        }

        .btn-checkout:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(155, 48, 255, 0.4);
        }

        .btn-checkout:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-checkout:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* ===== ANIMACIONES ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a1a1a;
            color: #e0d0f0;
            padding: 16px 32px;
            border-radius: 60px;
            border: 1px solid #9b30ff;
            box-shadow: 0 0 40px rgba(155, 48, 255, 0.2);
            font-weight: 600;
            opacity: 0;
            transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: #2a8a4a;
            box-shadow: 0 0 40px rgba(42, 138, 74, 0.2);
        }

        .toast.error {
            border-color: #8a2a3a;
            box-shadow: 0 0 40px rgba(138, 42, 58, 0.2);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .card {
                padding: 25px 18px 20px;
            }

            h1 {
                font-size: 38px;
            }

            .producto {
                flex-wrap: wrap;
                gap: 10px;
                padding: 15px;
            }

            .producto .info {
                width: 100%;
            }

            .producto .precio {
                font-size: 18px;
            }

            .catalogo {
                padding: 20px 15px;
            }

            .carrito {
                padding: 20px 15px;
            }

            .carrito-total {
                flex-direction: column;
                gap: 10px;
            }

            .carrito-item {
                flex-wrap: wrap;
                gap: 8px;
            }

            .carrito-item .item-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .btn {
                padding: 12px 30px;
                font-size: 15px;
            }

            .input-group input {
                max-width: 100%;
                font-size: 14px;
                padding: 12px 18px;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 30px;
            }

            .producto .info .nombre {
                font-size: 14px;
            }

            .producto .precio {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="card">
            <h1>💎 DiviMarket</h1>
            <div class="line"></div>
            <p class="subtitle">Recargas y Gift Cards • <span>Rapidez y confianza</span></p>

            <!-- SALDO -->
            <div class="saldo-container">
                💰 Saldo: <span id="saldoDisplay">$0.00</span>
            </div>

            <!-- INPUT ID FREE FIRE -->
            <div class="input-group">
                <input type="text" id="playerId" placeholder="🔑 Ingresa tu ID de Free Fire" maxlength="15" />
                <span class="input-hint">Ej: 1234567890</span>
                <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                    <button class="btn btn-small" onclick="verificarID()">
                        🔍 Verificar nombre
                    </button>
                    <button class="btn btn-small btn-success" onclick="recargarConID()">
                        ⚡ Recargar con este ID
                    </button>
                </div>
                <div id="nombreJugador" style="color:#c084fc; font-weight:600; min-height:24px; margin-top:8px;"></div>
            </div>

            <div class="footer-phone">
                📞 <strong>+58 424 2488 569</strong> — <span style="color:#6a5a7a;">Soporte 24/7</span>
            </div>
        </div>

        <!-- ===== CATÁLOGO ===== -->
        <div id="catalogo" class="catalogo">
            <h2>🔥 Free Fire</h2>
            <p class="sub">Selecciona tus recargas — Precios de revendedor</p>
            <div id="productosLista">
                <div class="loader">
                    <div class="spinner"></div>
                    <p>Cargando catálogo...</p>
                </div>
            </div>
        </div>

        <!-- ===== CARRITO ===== -->
        <div class="carrito" id="carrito">
            <div class="carrito-header">
                <h3>🛒 Tu carrito</h3>
                <span class="badge" id="carritoCount">0</span>
            </div>
            <div id="carritoItems">
                <div class="carrito-vacio">✨ Aún no hay productos en el carrito</div>
            </div>
            <div class="carrito-total">
